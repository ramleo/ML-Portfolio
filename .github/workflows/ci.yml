name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # On a pull request, gitleaks lists that PR's commits so it scans only what
    # the PR adds. Listing them reads pull-request data, which this repo's
    # default token scope (contents, metadata and packages, all read) does not
    # cover — so every PR failed with "Resource not accessible by integration"
    # while main passed, because main has no PR to list. Eight Dependabot PRs
    # sat red on this for two weeks.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Posting findings as PR comments would need pull-requests: WRITE,
          # and GitHub hands Dependabot-triggered runs a read-only token
          # whatever the workflow asks for — so comments would reintroduce the
          # same 403 on exactly the PRs this fixes. The job passing or failing
          # is the signal that matters; the finding is in the log.
          GITLEAKS_ENABLE_COMMENTS: false
  # D5: every commit ever made, not only the ones a pull request adds.
  #
  # `secret-scan` above hands gitleaks the PR's own commits, which answers
  # "does this change introduce a secret". Useful, and not the question that
  # matters before a repository goes public: a key committed in March and
  # deleted in April is invisible to it and perfectly visible to anyone who
  # clones. Until now the only full-history evidence was a local run somebody
  # did by hand once, which stops being true the moment the next commit lands.
  #
  # Demonstrated rather than assumed. In a throwaway repository, a
  # github-PAT-shaped token committed and then deleted is caught by
  # `gitleaks git` (exit 1, "leaks found: 1") and missed entirely by a
  # working-tree scan (exit 0, "no leaks found").
  #
  # The whole history is 1063 commits and takes about three seconds, so there is no
  # argument for running this on a schedule instead of every time.
  #
  # Pinned by version and run as a binary rather than through the action,
  # because the action's job is the PR-scoped scan the other job already does.
  secret-scan-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan every commit in the history
        run: /tmp/gitleaks git --no-banner --redact --exit-code 1 .


  # The 400-line limit used to be a rule someone had to remember, which meant
  # it was skipped exactly when following it was inconvenient. Now it fails the
  # build. See scripts/check-file-length.sh for what the baseline does.
  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file lengths
        run: ./scripts/check-file-length.sh

  # The handbook claims to be generated from capabilities.ts, so that it cannot
  # quietly disagree with the cards. That is only true if something checks —
  # otherwise the first person to edit a tool and forget to regenerate ships a
  # document that lies. This regenerates it and fails if the result differs.
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the handbook
        run: python3 scripts/build-handbook.py
      - name: Fail if it was not up to date
        run: |
          if ! git diff --quiet -- public/handbook.md; then
            echo "public/handbook.md is stale. Run: python3 scripts/build-handbook.py"
            git diff --stat -- public/handbook.md
            exit 1
          fi
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Phase 1 of the testing plan. Until this existed, CI proved the site
  # COMPILED and never that any page worked — three times a page was broken
  # for every visitor and nothing caught it.
  #
  # Browsers are installed here and only here. The @playwright/test package is
  # a normal devDependency (it has no postinstall, so `npm ci` does not pull
  # browsers down), which is what keeps Vercel deploys unaffected.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Point the build at the live Spaces so pages render against the same
      # URLs production uses. The phase-1 tests assert only on markup the page
      # owns, so a cold or rate-limited Space cannot fail this job.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ML_UNIFIED_URL: https://wram1708-ml-unified.hf.space
          NEXT_PUBLIC_ML_SQL_URL: https://wram1708-ml-sql.hf.space

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
